<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register — biolink</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#03050a; --bg-glow-1:#1b3aff; --bg-glow-2:#0891ff;
    --surface:rgba(15,20,34,0.6); --border:rgba(110,168,255,0.18);
    --field:rgba(6,9,18,0.7); --accent:#2f6bff; --accent-2:#6ea8ff;
    --text:#e7ecf7; --muted:#7c8aa8; --danger:#f87171;
  }
  * { box-sizing:border-box; }
  html,body{ height:100%; }
  body {
    margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  }
  body::before, body::after{ content:''; position:fixed; width:55vw; height:55vw; border-radius:50%; filter:blur(120px); opacity:0.3; z-index:0; }
  body::before{ top:-18vw; left:-18vw; background:var(--bg-glow-1); }
  body::after{ bottom:-22vw; right:-18vw; background:var(--bg-glow-2); }
  form {
    position:relative; z-index:1;
    background:var(--surface); backdrop-filter:blur(14px);
    padding:2.6em 2.4em; border-radius:18px; width:340px;
    border:1px solid var(--border);
    box-shadow:0 0 0 1px rgba(110,168,255,0.05), 0 20px 60px -20px rgba(0,0,0,0.6);
  }
  h2 { margin:0 0 0.9em; font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:-0.01em; }
  input {
    width:100%; padding:0.8em 0.9em; margin:0.4em 0; border-radius:9px;
    border:1px solid var(--border); background:var(--field); color:#fff; font-family:'Inter',sans-serif;
    outline:none; transition:border-color 0.15s ease;
  }
  input:focus{ border-color:var(--accent-2); }
  input::placeholder{ color:var(--muted); }
  button {
    width:100%; padding:0.85em; margin-top:1.1em; border:none; border-radius:9px;
    background:linear-gradient(135deg,var(--accent),#1a4fd6); color:#fff; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif; box-shadow:0 8px 24px -8px rgba(47,107,255,0.7);
    transition:transform 0.15s ease;
  }
  button:hover{ transform:translateY(-1px); }
  .err { color:var(--danger); font-size:0.85em; min-height:1.2em; margin-top:0.3em; }
  a { color:var(--accent-2); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  p.hint{ text-align:center; color:var(--muted); font-size:0.9em; }
</style>
</head>
<body>
<form id="f">
  <h2>Create your page</h2>
  <input name="username" placeholder="username" required>
  <input name="email" type="email" placeholder="email" required>
  <input name="password" type="password" placeholder="password (8+ chars)" required>
  <div class="err" id="err"></div>
  <button type="submit">Sign up</button>
  <p class="hint">Already have an account? <a href="/login.html">Log in</a></p>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const res = await fetch('/api/auth/register', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)
  });
  const json = await res.json();
  if (!res.ok) { document.getElementById('err').textContent = json.error; return; }
  window.location.href = '/dashboard';
});
</script>
</body>
</html>
