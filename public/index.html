<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>biolink — make your page</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#03050a;
    --bg-glow-1:#1b3aff;
    --bg-glow-2:#0891ff;
    --surface:rgba(15,20,34,0.55);
    --border:rgba(110,168,255,0.16);
    --accent:#2f6bff;
    --accent-2:#6ea8ff;
    --text:#e7ecf7;
    --muted:#7c8aa8;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column;
    position:relative; overflow:hidden; text-align:center; padding:2em 1em;
  }
  /* ambient glow field */
  body::before, body::after{
    content:''; position:fixed; width:60vw; height:60vw; border-radius:50%; filter:blur(120px); opacity:0.35; z-index:0;
  }
  body::before{ top:-20vw; left:-15vw; background:var(--bg-glow-1); }
  body::after{ bottom:-25vw; right:-15vw; background:var(--bg-glow-2); }
  .grid-overlay{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:linear-gradient(rgba(110,168,255,0.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(110,168,255,0.05) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse at center, black 0%, transparent 70%);
  }
  .eyebrow{
    position:relative; z-index:1; font-family:'Space Grotesk',sans-serif; font-size:0.78rem; letter-spacing:0.22em;
    text-transform:uppercase; color:var(--accent-2); margin-bottom:1.1em; opacity:0.85;
  }
  h1 {
    position:relative; z-index:1;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(2.4rem,7vw,4.4rem); line-height:1.05;
    margin:0 0 0.35em; letter-spacing:-0.02em;
    background:linear-gradient(100deg,#dce6ff 10%, var(--accent-2) 45%, var(--accent) 75%, #7ef0ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p.sub { position:relative; z-index:1; color:var(--muted); margin:0 0 2.4em; font-size:1.05rem; max-width:32em; }
  .row { position:relative; z-index:1; display:flex; gap:1em; }
  a.btn {
    padding:0.9em 1.9em; border-radius:11px; text-decoration:none; font-weight:600; font-size:0.95rem;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  a.btn:hover{ transform:translateY(-2px); }
  .primary { background:linear-gradient(135deg,var(--accent),#1a4fd6); color:#fff; box-shadow:0 0 0 1px rgba(110,168,255,0.3), 0 8px 30px -8px rgba(47,107,255,0.7); }
  .primary:hover{ box-shadow:0 0 0 1px rgba(110,168,255,0.5), 0 10px 34px -6px rgba(47,107,255,0.9); }
  .secondary { background:var(--surface); color:#fff; border:1px solid var(--border); backdrop-filter:blur(10px); }
  .secondary:hover{ border-color:var(--accent-2); }
</style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="eyebrow">/ your identity, one link /</div>
  <h1>your page.<br>your way.</h1>
  <p class="sub">Build a customizable bio link page in minutes — custom themes, animated backgrounds, Discord presence, and more.</p>
  <div class="row">
    <a class="btn primary" href="/register.html">Get started</a>
    <a class="btn secondary" href="/login.html">Log in</a>
  </div>
</body>
</html>
