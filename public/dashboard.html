<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — biolink</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#03050a; --surface:rgba(15,20,34,0.55); --surface-solid:#0d1220;
    --border:rgba(110,168,255,0.16); --field:rgba(6,9,18,0.7);
    --accent:#2f6bff; --accent-2:#6ea8ff; --text:#e7ecf7; --muted:#7c8aa8;
    --danger:#f87171; --success:#4ade80;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  body::before{
    content:''; position:fixed; top:-20vw; right:-15vw; width:50vw; height:50vw; border-radius:50%;
    background:#1b3aff; filter:blur(130px); opacity:0.18; z-index:0; pointer-events:none;
  }
  header {
    position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center;
    padding:1.1em 2em; border-bottom:1px solid var(--border); background:rgba(4,6,12,0.6); backdrop-filter:blur(10px);
  }
  header strong{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; }
  header a { color:var(--accent-2); text-decoration:none; font-weight:600; }
  header a:hover{ text-decoration:underline; }
  main { position:relative; z-index:1; max-width:700px; margin:2em auto; padding:0 1.5em; }
  section {
    background:var(--surface); backdrop-filter:blur(12px); border:1px solid var(--border);
    border-radius:16px; padding:1.6em 1.7em; margin-bottom:1.5em;
    box-shadow:0 12px 40px -20px rgba(0,0,0,0.5);
  }
  h3 { margin-top:0; font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:-0.01em; }
  label { display:block; font-size:0.85em; color:var(--muted); margin-top:0.9em; }
  input, textarea, select {
    width:100%; padding:0.65em 0.8em; border-radius:9px; border:1px solid var(--border);
    background:var(--field); color:#fff; margin-top:0.35em; font-family:'Inter',sans-serif; outline:none;
    transition:border-color 0.15s ease;
  }
  input:focus, textarea:focus, select:focus{ border-color:var(--accent-2); }
  input[type="color"]{ padding:0.3em; height:2.6em; cursor:pointer; }
  textarea { resize:vertical; min-height:70px; }
  button {
    padding:0.65em 1.3em; border:none; border-radius:9px;
    background:linear-gradient(135deg,var(--accent),#1a4fd6); color:#fff; font-weight:600; cursor:pointer;
    margin-top:1em; font-family:'Inter',sans-serif; box-shadow:0 8px 22px -10px rgba(47,107,255,0.7);
    transition:transform 0.15s ease;
  }
  button:hover{ transform:translateY(-1px); }
  button.secondary { background:rgba(255,255,255,0.06); box-shadow:none; border:1px solid var(--border); }
  .link-row { display:flex; gap:0.5em; align-items:center; margin-top:0.6em; }
  .link-row span { flex:1; font-size:0.9em; color:#ccd3e3; }
  .link-row button { margin:0; padding:0.35em 0.8em; background:rgba(248,113,113,0.12); color:var(--danger); box-shadow:none; border:1px solid rgba(248,113,113,0.25); }
  .msg { font-size:0.85em; color:var(--success); min-height:1.2em; margin-top:0.4em; }
  .preview-link { display:block; margin-top:0.5em; color:var(--accent-2); }
</style>
</head>
<body>
<header>
  <strong>biolink dashboard</strong>
  <div>
    <a id="viewLink" href="#" target="_blank" style="margin-right:1.5em;">View my page →</a>
    <a href="#" id="logout">Log out</a>
  </div>
</header>
<main>
  <section>
    <h3>Profile</h3>
    <label>Display name</label>
    <input id="display_name">
    <label>Bio</label>
    <textarea id="bio"></textarea>
    <label>Accent color</label>
    <input id="accent_color" type="color">
    <label>Cursor effect</label>
    <select id="cursor_effect">
      <option value="trail">Particle trail</option>
      <option value="dot">Glow dot</option>
      <option value="none">None (default cursor)</option>
    </select>
    <label>Background type</label>
    <select id="background_type">
      <option value="particles">Animated particles (no upload needed)</option>
      <option value="image">Custom image</option>
      <option value="video">Custom video</option>
    </select>
    <label>Discord User ID (for presence widget, optional)</label>
    <input id="discord_id" placeholder="e.g. 123456789012345678">
    <button id="saveProfile">Save profile</button>
    <div class="msg" id="profileMsg"></div>
  </section>

  <section>
    <h3>Avatar</h3>
    <input type="file" id="avatarFile" accept="image/*">
    <button id="uploadAvatar">Upload avatar</button>
    <div class="msg" id="avatarMsg"></div>
  </section>

  <section>
    <h3>Background media</h3>
    <p style="color:var(--muted);font-size:0.85em;">Upload an image or video. This only matters if Background type above is set to image/video.</p>
    <input type="file" id="bgFile" accept="image/*,video/*">
    <button id="uploadBg">Upload background</button>
    <div class="msg" id="bgMsg"></div>
  </section>

  <section>
    <h3>Profile music</h3>
    <input type="file" id="audioFile" accept="audio/*">
    <button id="uploadAudio">Upload track</button>
    <div class="msg" id="audioMsg"></div>
  </section>

  <section>
    <h3>Links</h3>
    <div id="linksList"></div>
    <div class="link-row">
      <input id="linkPlatform" placeholder="Platform (e.g. Twitter)" style="flex:1">
      <input id="linkUrl" placeholder="https://..." style="flex:2">
      <button id="addLink">Add</button>
    </div>
  </section>
</main>

<script>
let me = null;

async function loadMe() {
  const res = await fetch('/api/profile/me');
  if (!res.ok) { window.location.href = '/login.html'; return; }
  const data = await res.json();
  me = data.user;
  document.getElementById('display_name').value = me.display_name || '';
  document.getElementById('bio').value = me.bio || '';
  document.getElementById('accent_color').value = me.accent_color || '#2f6bff';
  document.getElementById('cursor_effect').value = me.cursor_effect || 'trail';
  document.getElementById('background_type').value = me.background_type || 'particles';
  document.getElementById('discord_id').value = me.discord_id || '';
  document.getElementById('viewLink').href = '/' + me.username;
  renderLinks(data.links);
}

function renderLinks(links) {
  const el = document.getElementById('linksList');
  el.innerHTML = '';
  links.forEach(l => {
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = `<span>${l.platform}: ${l.url}</span><button data-id="${l.id}">Remove</button>`;
    row.querySelector('button').onclick = async () => {
      await fetch('/api/profile/me/links/' + l.id, { method:'DELETE' });
      loadMe();
    };
    el.appendChild(row);
  });
}

document.getElementById('saveProfile').onclick = async () => {
  const body = {
    display_name: document.getElementById('display_name').value,
    bio: document.getElementById('bio').value,
    accent_color: document.getElementById('accent_color').value,
    cursor_effect: document.getElementById('cursor_effect').value,
    background_type: document.getElementById('background_type').value,
    discord_id: document.getElementById('discord_id').value
  };
  const res = await fetch('/api/profile/me', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  document.getElementById('profileMsg').textContent = res.ok ? 'Saved!' : 'Error saving';
};

document.getElementById('uploadAvatar').onclick = async () => {
  const f = document.getElementById('avatarFile').files[0];
  if (!f) return;
  const fd = new FormData(); fd.append('avatar', f);
  const res = await fetch('/api/profile/me/avatar', { method:'POST', body: fd });
  const json = await res.json();
  document.getElementById('avatarMsg').textContent = res.ok ? 'Uploaded!' : json.error;
};

document.getElementById('uploadBg').onclick = async () => {
  const f = document.getElementById('bgFile').files[0];
  if (!f) return;
  const fd = new FormData(); fd.append('background', f);
  const res = await fetch('/api/profile/me/background', { method:'POST', body: fd });
  const json = await res.json();
  document.getElementById('bgMsg').textContent = res.ok ? 'Uploaded!' : json.error;
};

document.getElementById('uploadAudio').onclick = async () => {
  const f = document.getElementById('audioFile').files[0];
  if (!f) return;
  const fd = new FormData(); fd.append('audio', f);
  const res = await fetch('/api/profile/me/audio', { method:'POST', body: fd });
  const json = await res.json();
  document.getElementById('audioMsg').textContent = res.ok ? 'Uploaded!' : json.error;
};

document.getElementById('addLink').onclick = async () => {
  const platform = document.getElementById('linkPlatform').value.trim();
  const url = document.getElementById('linkUrl').value.trim();
  if (!platform || !url) return;
  await fetch('/api/profile/me/links', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({platform, url}) });
  document.getElementById('linkPlatform').value = '';
  document.getElementById('linkUrl').value = '';
  loadMe();
};

document.getElementById('logout').onclick = async (e) => {
  e.preventDefault();
  await fetch('/api/auth/logout', { method:'POST' });
  window.location.href = '/';
};

loadMe();
</script>
</body>
</html>
